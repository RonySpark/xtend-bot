name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest

  db-lint:
    name: db-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint a database built from the fixtures
        run: |
          python tools/ingest_followers.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/followers_day1.json \
            --list followers \
            --date 2026-01-01
          python tools/ingest_followers.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/followers_day2.json \
            --list followers \
            --date 2026-01-02
          python tools/ingest_posts.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/posts_page.json \
            --kind posts \
            --owner 1000 \
            --date 2026-01-03
          python tools/ingest_posts.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/likes_page.json \
            --kind like \
            --post 2001 \
            --date 2026-01-03
          python tools/ingest_posts.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/reposts_page.json \
            --kind repost \
            --post 2001 \
            --date 2026-01-03
          python tools/ingest_posts.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/quotes_page.json \
            --kind quote \
            --post 2001 \
            --date 2026-01-03
          python tools/ingest_posts.py \
            --db "$RUNNER_TEMP/xtend.db" \
            --file tests/fixtures/replies_page.json \
            --kind reply \
            --post 2001 \
            --date 2026-01-03
          python tools/db_lint.py --db "$RUNNER_TEMP/xtend.db"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose
